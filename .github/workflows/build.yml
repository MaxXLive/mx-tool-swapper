name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main]
  workflow_dispatch:

# never run two releases at the same time, they would pick the same patch number
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for version + changelog

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        id: info
        run: bash .github/scripts/release-info.sh "$RUNNER_TEMP/CHANGELOG.md"

      - name: Build
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="${{ steps.info.outputs.version }}-pr.${{ github.event.number }}"
          else
            version="${{ steps.info.outputs.version }}"
          fi
          echo "Building $version"
          chmod +x gradlew
          ./gradlew build runGameTest -PreleaseVersion="$version" --no-configuration-cache

      - uses: actions/upload-artifact@v7
        with:
          name: MXToolSwapper
          path: build/libs/MXToolSwapper-fabric-*.jar
          if-no-files-found: error

      - name: Create release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          cat "$RUNNER_TEMP/CHANGELOG.md"
          gh release create "$TAG" \
            build/libs/MXToolSwapper-fabric-"$VERSION".jar \
            --target "$GITHUB_SHA" \
            --title "MX Tool Swapper $VERSION" \
            --notes-file "$RUNNER_TEMP/CHANGELOG.md"

      - name: Upload to CurseForge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.info.outputs.released != 'true' && steps.info.outputs.relevant == 'true'
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: "1796511"
          FILE: build/libs/MXToolSwapper-fabric-${{ steps.info.outputs.version }}.jar
          DISPLAY_NAME: MX Tool Swapper ${{ steps.info.outputs.version }}
          CHANGELOG_FILE: ${{ runner.temp }}/CHANGELOG.md
          MC_VERSION: ${{ steps.info.outputs.mc }}
          ENVIRONMENTS: Client
          JAVA_VERSION: Java 25
          RELATIONS: '[{"slug":"fabric-api","type":"requiredDependency"},{"slug":"cloth-config","type":"requiredDependency"},{"slug":"modmenu","type":"optionalDependency"}]'
        run: bash .github/scripts/curseforge-upload.sh
